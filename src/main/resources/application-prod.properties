server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}

app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Administrador}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@servicego.local}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

services:
  db:
    image: postgres:17
    container_name: servicego-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: servicego
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - servicego_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicego"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicego-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/servicego
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      JWT_SECRET: servicego-secret-key-2026-super-segura-123456
      JWT_EXPIRATION_HOURS: 12
      BOOTSTRAP_ADMIN_NAME: Administrador
      BOOTSTRAP_ADMIN_EMAIL: admin@servicego.local
      BOOTSTRAP_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"

volumes:
  servicego_postgres_data:
